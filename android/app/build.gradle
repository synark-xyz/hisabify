apply plugin: 'com.android.application'

def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

def resolveSecret = { propName ->
    localProps.getProperty(propName) ?: System.getenv(propName) ?: ""
}

android {
    namespace = "io.synark.hisabify"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.synark.hisabify"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Signing configurations for release and staging. Values are read from local.properties
    // or environment variables via the resolveSecret helper defined above.
    signingConfigs {
        release {
            def ksPath = resolveSecret('KEYSTORE_PATH_RELEASE')
            if (ksPath) {
                storeFile file(ksPath)
            }
            storePassword resolveSecret('KEYSTORE_PASSWORD_RELEASE')
            keyAlias resolveSecret('KEY_ALIAS_RELEASE')
            keyPassword resolveSecret('KEY_PASSWORD_RELEASE')
        }
        staging {
            // Prefer staging-specific values, fall back to release values when not provided.
            def ksPath = resolveSecret('KEYSTORE_PATH_STAGING') ?: resolveSecret('KEYSTORE_PATH_RELEASE')
            if (ksPath) {
                storeFile file(ksPath)
            }
            storePassword resolveSecret('KEYSTORE_PASSWORD_STAGING') ?: resolveSecret('KEYSTORE_PASSWORD_RELEASE')
            keyAlias resolveSecret('KEY_ALIAS_STAGING') ?: resolveSecret('KEY_ALIAS_RELEASE')
            keyPassword resolveSecret('KEY_PASSWORD_STAGING') ?: resolveSecret('KEY_PASSWORD_RELEASE')
        }
    }
    buildFeatures {
        buildConfig true
    }
    buildTypes {
        debug {
            buildConfigField("String", "ENVIRONMENT", '"development"')
            // RevenueCat sandbox key — injected from local.properties or CI env var
            buildConfigField "String", "REVENUECAT_API_KEY",
                    "\"${resolveSecret('REVENUECAT_API_KEY_DEBUG')}\""
            // Development endpoint (used by app entry / native code)
            buildConfigField "String", "ENDPOINT", '"https://hisabify-staging.vercel.app"'
        }
        staging {
            debuggable true
            minifyEnabled false
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
            // When consuming library modules that don't declare a 'staging' buildType,
            // fall back to the 'debug' variant so variant matching succeeds.
            matchingFallbacks = ['debug']
            // RevenueCat key for staging — prefer a staging-specific key, fall back to debug
            buildConfigField "String", "REVENUECAT_API_KEY",
                    "\"${resolveSecret('REVENUECAT_API_KEY_STAGING') ?: resolveSecret('REVENUECAT_API_KEY_DEBUG')}\""
            buildConfigField "String", "ENVIRONMENT", '"staging"'
            // Only assign the signingConfig if a keystore/storeFile was configured
            if (signingConfigs.staging?.storeFile) {
                signingConfig signingConfigs.staging
            }
            // Staging endpoint (same as development preview)
            buildConfigField "String", "ENDPOINT", '"https://hisabify-staging.vercel.app"'
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            debuggable false
            buildConfigField "String", "ENVIRONMENT", '"production"'
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // RevenueCat production key — injected from local.properties or CI env var
            buildConfigField "String", "REVENUECAT_API_KEY",
                "\"${resolveSecret('REVENUECAT_API_KEY_RELEASE')}\""
            // Production endpoint
            buildConfigField "String", "ENDPOINT", '"https://hisabify-pi.vercel.app"'
            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation 'com.revenuecat.purchases:purchases:9.26.1'
    implementation 'com.revenuecat.purchases:purchases-ui:9.26.1'
    implementation platform('com.google.firebase:firebase-bom:34.11.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-messaging'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
        apply plugin: 'com.google.firebase.crashlytics'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work: ${e.message}")
}
