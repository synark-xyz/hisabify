apply plugin: 'com.android.application'

def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

def resolveSecret = { propName ->
    localProps.getProperty(propName) ?: System.getenv(propName) ?: ""
}
def ADMOB_TEST_APP_ID = "ca-app-pub-3940256099942544~3347511713"
def admobReleaseAppId = resolveSecret('ADMOB_APP_ID_RELEASE') ?: ADMOB_TEST_APP_ID
android {
    lint {
        abortOnError false
        warning 'unchecked', 'deprecation'
    }
    namespace = "io.synark.hisabify"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.synark.hisabify"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 7
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini!*~'
        }
    }
    // Signing configurations for release and staging. Values are read from local.properties
    // or environment variables via the resolveSecret helper defined above.
    signingConfigs {
        release {
            def ksPath = resolveSecret('KEYSTORE_PATH_RELEASE')
            if (ksPath) {
                storeFile file(ksPath)
            }
            storePassword resolveSecret('KEYSTORE_PASSWORD_RELEASE')
            keyAlias resolveSecret('KEY_ALIAS_RELEASE')
            keyPassword resolveSecret('KEY_PASSWORD_RELEASE')
        }
        staging {
            // Prefer staging-specific values, fall back to release values when not provided.
            def ksPath = resolveSecret('KEYSTORE_PATH_STAGING') ?: resolveSecret('KEYSTORE_PATH_RELEASE')
            if (ksPath) {
                storeFile file(ksPath)
            }
            storePassword resolveSecret('KEYSTORE_PASSWORD_STAGING') ?: resolveSecret('KEYSTORE_PASSWORD_RELEASE')
            keyAlias resolveSecret('KEY_ALIAS_STAGING') ?: resolveSecret('KEY_ALIAS_RELEASE')
            keyPassword resolveSecret('KEY_PASSWORD_STAGING') ?: resolveSecret('KEY_PASSWORD_RELEASE')
        }
    }
    buildFeatures {
        buildConfig true
    }
    packagingOptions {
        resources {
            excludes += [
                    'assets/dexopt/**',
                    'baselineProfiles/**',
                    'assets/dexopt/baseline.prof',
                    'assets/dexopt/baseline.profm'
            ]
        }
    }
    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
            buildConfigField("String", "ENVIRONMENT", '"development"')
            // RevenueCat sandbox key — injected from local.properties or CI env var
            buildConfigField "String", "REVENUECAT_API_KEY",
                    "\"${resolveSecret('REVENUECAT_API_KEY_DEBUG')}\""
            // Development endpoint (used by app entry / native code)
            buildConfigField "String", "ENDPOINT", '"https://hisabify-staging.vercel.app"'
            manifestPlaceholders = [admobAppId: ADMOB_TEST_APP_ID]
        }
        staging {
            debuggable true
            minifyEnabled false
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
            // When consuming library modules that don't declare a 'staging' buildType,
            // fall back to the 'debug' variant so variant matching succeeds.
            matchingFallbacks = ['debug']
            // RevenueCat key for staging — prefer a staging-specific key, fall back to debug
            buildConfigField "String", "REVENUECAT_API_KEY",
                    "\"${resolveSecret('REVENUECAT_API_KEY_STAGING') ?: resolveSecret('REVENUECAT_API_KEY_DEBUG')}\""
            buildConfigField "String", "ENVIRONMENT", '"staging"'
            // Staging endpoint (same as development preview)
            buildConfigField "String", "ENDPOINT", '"https://hisabify-staging.vercel.app"'
            // .staging is not registered with AdMob; the test app ID keeps the SDK from crashing
            // at startup and the build from ever requesting a real ad.
            manifestPlaceholders = [admobAppId: ADMOB_TEST_APP_ID]
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
            signingConfig signingConfigs.staging
        }
        release {
            minifyEnabled true
            debuggable false
            buildConfigField "String", "ENVIRONMENT", '"production"'
            // RevenueCat production key — injected from local.properties or CI env var
            buildConfigField "String", "REVENUECAT_API_KEY",
                "\"${resolveSecret('REVENUECAT_API_KEY_RELEASE')}\""
            // Production endpoint
            buildConfigField "String", "ENDPOINT", '"https://hisabify-pi.vercel.app"'
            manifestPlaceholders = [admobAppId: admobReleaseAppId]
            if (admobReleaseAppId == ADMOB_TEST_APP_ID) {
                logger.warn("WARNING: ADMOB_APP_ID_RELEASE is not set — this release build ships " +
                        "Google's test AdMob app ID and will earn nothing. Set it in " +
                        "local.properties or as an environment variable.")
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation 'com.revenuecat.purchases:purchases:10.18.1'
    implementation 'com.revenuecat.purchases:purchases-ui:10.18.1'
    implementation platform('com.google.firebase:firebase-bom:34.18.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-messaging'
}

apply from: 'capacitor.build.gradle'

// Firebase is an unconditional compile dependency above, so the google-services plugin MUST
// run. Skipping it produces no `google_app_id` resource, the default FirebaseApp never
// auto-initializes, and the first PushNotifications.register() throws
// "Default FirebaseApp is not initialized" on Capacitor's native plugin thread — killing the
// process where no JS try/catch can reach it. Fail at configuration time instead.
def googleServicesFile = [
        'google-services.json',
        'src/release/google-services.json',
        'src/staging/google-services.json',
        'src/debug/google-services.json',
].find { file(it).exists() }

if (!googleServicesFile) {
    throw new GradleException("""
Missing google-services.json — this build would crash on launch.

Download it from the Firebase console and place it at:
    android/app/google-services.json

It must contain a client entry for every applicationId this project builds:
    io.synark.hisabify           (release)
    io.synark.hisabify.staging   (debug + staging — see applicationIdSuffix)
Register both packages as Android apps in the Firebase project, otherwise the
google-services plugin fails with "No matching client found for package name".
""")
}

apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
