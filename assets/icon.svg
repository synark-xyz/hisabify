<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3B82F6" />
            <stop offset="50%" stop-color="#8B5CF6" />
            <stop offset="100%" stop-color="#EC4899" />
        </linearGradient>
    </defs>

    <!-- Background circle with gradient -->
    <circle cx="512" cy="512" r="492" fill="url(#logoGradient)" />

    <!-- Donut Chart (main element) -->
    <!-- Outer ring - segmented donut chart -->

    <!-- Segment 1 - Blue (35%) -->
    <path
        d="M 512 184 A 328 328 0 0 1 774 312 L 664 409 A 184 184 0 0 0 512 328 Z"
        fill="#60A5FA"
        opacity="0.95"
    />

    <!-- Segment 2 - Purple (30%) -->
    <path
        d="M 774 312 A 328 328 0 0 1 840 512 L 696 512 A 184 184 0 0 0 664 409 Z"
        fill="#A78BFA"
        opacity="0.95"
    />

    <!-- Segment 3 - Pink (25%) -->
    <path
        d="M 840 512 A 328 328 0 0 1 712 774 L 623 664 A 184 184 0 0 0 696 512 Z"
        fill="#F472B6"
        opacity="0.95"
    />

    <!-- Segment 4 - Yellow (10%) -->
    <path
        d="M 712 774 A 328 328 0 0 1 512 840 L 512 696 A 184 184 0 0 0 623 664 Z"
        fill="#FCD34D"
        opacity="0.95"
    />

    <!-- Inner white circle (donut hole) -->
    <circle cx="512" cy="512" r="174" fill="white" opacity="0.98" />

    <!-- Dollar symbol in center -->
    <text
        x="512"
        y="594"
        font-size="205"
        font-weight="bold"
        fill="url(#logoGradient)"
        text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
    >
        $
    </text>
</svg>
